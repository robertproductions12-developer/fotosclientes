<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA ALP - GESTIÓN TOTAL</title>
    
    <!-- Librerías -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg: #010409;
            --accent: #00f2ff;
            --blue-neon: #0077ff;
            --glass: rgba(15, 23, 42, 0.9);
            --border: rgba(0, 242, 255, 0.3);
            --danger: #ff4d4d;
            --success: #10b981;
            --gold: #ffda44;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(circle at center, #0f172a 0%, #010409 100%);
            color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden;
        }

        .app-card {
            width: 100%; max-width: 500px; background: var(--glass); backdrop-filter: blur(25px);
            border: 2px solid var(--border); border-radius: 30px; padding: 20px;
            height: 95vh; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }
        .header span { color: var(--accent); }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 15px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; color: rgba(255,255,255,0.4); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .tab-btn.active { background: var(--blue-neon); color: white; }

        .view { display: none; flex-direction: column; overflow-y: auto; flex: 1; padding-right: 5px; }
        .view.active { display: flex; }

        /* Estilos Emisor */
        .cam-container { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem; transition: 0.3s; }
        .btn-cap { background: var(--accent); color: #000; }
        .btn-send { background: linear-gradient(90deg, #0077ff, #00d4ff); margin-top: 5px; }
        .gallery { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .thumb { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; background-size: cover; background-position: center; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; margin-bottom: 8px; outline: none; }

        /* Estilos Receptor (CARPETAS) */
        .folder { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); border-left: 5px solid var(--accent); position: relative; }
        .folder-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .folder-title { color: var(--accent); font-weight: bold; font-size: 1rem; }
        .folder-info { font-size: 0.7rem; color: rgba(255,255,255,0.6); line-height: 1.4; }
        
        .grid-fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .foto-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .foto-item img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; }
        .btn-dl-small { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); border: none; color: var(--accent); font-size: 0.6rem; padding: 4px; cursor: pointer; }

        .btn-zip { background: var(--success); margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-del { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 5px 10px; border-radius: 8px; font-size: 0.6rem; cursor: pointer; }
        .btn-del-all { background: var(--danger); margin-bottom: 15px; font-size: 0.7rem; letter-spacing: 1px; }

        /* Juego */
        #game-container { background: #000; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid var(--accent); flex: 1; display: flex; flex-direction: column; }
        #game-canvas { width: 100%; flex: 1; touch-action: none; }
        .game-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; pointer-events: none; font-size: 0.8rem; }
        #power-bar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 4px 15px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: none; }

        #modal-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        #modal-viewer img { max-width: 95%; max-height: 80%; border: 2px solid var(--accent); border-radius: 10px; }
        
        .footer-tag { text-align: center; font-size: 0.6rem; color: rgba(255,255,255,0.2); padding: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="modal-viewer" onclick="this.style.display='none'"><img id="img-full" src=""></div>

    <div class="app-card">
        <div class="header">
            <h1>DESPACHO <span>ALP</span></h1>
            <div style="font-size: 0.6rem; text-align: right;">v2.0 PRO<br><span id="status" style="color:var(--success)">CONECTADO</span></div>
        </div>

        <div class="tabs">
            <button id="t-emisor" class="tab-btn active" onclick="switchTab('emisor')">EMISOR</button>
            <button id="t-receptor" class="tab-btn" onclick="switchTab('receptor')">RECEPTOR</button>
            <button id="t-juego" class="tab-btn" onclick="switchTab('juego')">🎮 RELAX</button>
        </div>

        <!-- VISTA EMISOR -->
        <div id="v-emisor" class="view active">
            <div class="cam-container"><video id="video" autoplay playsinline></video></div>
            <canvas id="canvas" class="hidden"></canvas>
            
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px; margin-bottom:12px;">
                <button class="btn btn-cap" onclick="capturePhoto()">📷 CAPTURAR (<span id="count">0</span>/5)</button>
                <button class="btn" style="background:#1e293b" onclick="deleteLastPhoto()">BORRAR ÚLTIMA</button>
            </div>

            <div class="gallery">
                <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
            </div>

            <input type="text" id="nombre" placeholder="Nombre del Cliente / Receptor">
            <input type="text" id="nota" placeholder="Número de Nota de Entrega">
            <button class="btn btn-send" id="btn-envio" onclick="enviarAFirebase()">🚀 SUBIR EXPEDIENTE</button>
        </div>

        <!-- VISTA RECEPTOR -->
        <div id="v-receptor" class="view">
            <button class="btn btn-del-all" onclick="eliminarTodo()">⚠️ ELIMINAR TODA LA BASE DE DATOS</button>
            <input type="text" id="buscador" placeholder="🔍 Buscar por N° de Nota..." oninput="filtrarCarpetas()">
            <div id="listado-realtime">
                <!-- Se llena con Firebase -->
            </div>
        </div>

        <!-- VISTA JUEGO -->
        <div id="v-juego" class="view">
            <div id="game-container">
                <div class="game-ui">
                    <div style="color:var(--accent)">PUNTOS: <span id="game-score">0</span></div>
                    <div style="color:var(--gold)">RÉCORD: <span id="game-high">0</span></div>
                </div>
                <div id="power-bar"></div>
                <canvas id="game-canvas"></canvas>
            </div>
            <p style="text-align:center; font-size:0.6rem; margin-top:8px; color:rgba(255,255,255,0.4)">TOCA PARA SALTAR Y ESQUIVAR CAJAS</p>
        </div>

        <div class="footer-tag">SISTEMA INTEGRAL ALP © 2026 - ROBERT/ELY/HIMMER/PEDRO/HERNÁN</div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE (Usa tu propia configuración si esta expira)
        const firebaseConfig = { 
            apiKey: "AIzaSyDia46IAJrJDEuLGA9ULKTlebcjiZ1dYig", 
            authDomain: "fotosclientes-c172e.firebaseapp.com", 
            projectId: "fotosclientes-c172e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- LÓGICA EMISOR ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let misFotos = [];

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => video.srcObject = s)
            .catch(e => alert("Error cámara: " + e));

        function capturePhoto() {
            if(misFotos.length >= 5) return alert("Máximo 5 fotos por nota");
            canvas.width = 800; canvas.height = 600;
            canvas.getContext('2d').drawImage(video, 0, 0, 800, 600);
            misFotos.push(canvas.toDataURL('image/jpeg', 0.7));
            actualizarInterfaz();
        }

        function deleteLastPhoto() { misFotos.pop(); actualizarInterfaz(); }

        function actualizarInterfaz() {
            document.getElementById('count').innerText = misFotos.length;
            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach((t, i) => { 
                t.style.backgroundImage = misFotos[i] ? `url(${misFotos[i]})` : 'none'; 
            });
        }

        async function enviarAFirebase() {
            const nom = document.getElementById('nombre').value;
            const not = document.getElementById('nota').value;
            const btn = document.getElementById('btn-envio');

            if(!nom || !not || misFotos.length === 0) return alert("Faltan datos o fotos");
            
            btn.disabled = true;
            btn.innerText = "SUBIENDO...";

            try {
                await db.collection("entregas").add({ 
                    responsable: nom, 
                    nota: not, 
                    imagenes: misFotos, 
                    fecha: new Date().toLocaleDateString(), 
                    hora: new Date().toLocaleTimeString(), 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                });
                alert("CARPETA GUARDADA CON ÉXITO");
                location.reload();
            } catch(e) { 
                alert("Error al subir"); 
                btn.disabled = false;
            }
        }

        // --- LÓGICA RECEPTOR ---
        function switchTab(t) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`v-${t}`).classList.add('active');
            document.getElementById(`t-${t}`).classList.add('active');
            if(t === 'receptor') iniciarEscucha();
            if(t === 'juego') initGame(); else gameActive = false;
        }

        let datosGlobales = [];

        function iniciarEscucha() {
            db.collection("entregas").orderBy("timestamp", "desc").onSnapshot(snap => {
                datosGlobales = [];
                const cont = document.getElementById('listado-realtime');
                cont.innerHTML = "";
                
                snap.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    datosGlobales.push({id, ...d});
                    
                    const folderHTML = `
                        <div class="folder" data-nota="${d.nota}">
                            <div class="folder-header">
                                <div>
                                    <div class="folder-title">📦 NOTA: ${d.nota}</div>
                                    <div class="folder-info">
                                        👤 CLIENTE: ${d.responsable}<br>
                                        📅 FECHA: ${d.fecha} | ⏰ HORA: ${d.hora}
                                    </div>
                                </div>
                                <button class="btn-del" onclick="eliminarRegistro('${id}')">ELIMINAR</button>
                            </div>
                            
                            <div class="grid-fotos">
                                ${d.imagenes.map((img, index) => `
                                    <div class="foto-item">
                                        <img src="${img}" onclick="verImagen('${img}')">
                                        <button class="btn-dl-small" onclick="descargarImagen('${img}', 'Nota_${d.nota}_F${index+1}.jpg')">DESCARGAR</button>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <button class="btn btn-zip" onclick="generarZip('${id}')">
                                📥 DESCARGAR CARPETA COMPLETA (ZIP)
                            </button>
                        </div>
                    `;
                    cont.innerHTML += folderHTML;
                });
            });
        }

        function verImagen(src) {
            document.getElementById('img-full').src = src;
            document.getElementById('modal-viewer').style.display = 'flex';
        }

        function descargarImagen(base64, name) {
            const link = document.createElement('a');
            link.href = base64;
            link.download = name;
            link.click();
        }

        async function generarZip(id) {
            const data = datosGlobales.find(d => d.id === id);
            if(!data) return;

            const zip = new JSZip();
            const folder = zip.folder(`Expediente_Nota_${data.nota}`);

            // Agregar Fotos
            data.imagenes.forEach((img, i) => {
                const imgData = img.split(',')[1];
                folder.file(`Foto_${i+1}.jpg`, imgData, {base64: true});
            });

            // Agregar Info TXT
            const texto = `DETALLES DEL DESPACHO\n\nNota: ${data.nota}\nCliente: ${data.responsable}\nFecha: ${data.fecha}\nHora: ${data.hora}\nFotos totales: ${data.imagenes.length}`;
            folder.file("detalles.txt", texto);

            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `ALP_Nota_${data.nota}.zip`);
        }

        async function eliminarRegistro(id) {
            if(confirm("¿Estás seguro de eliminar esta carpeta permanentemente?")) {
                await db.collection("entregas").doc(id).delete();
            }
        }

        async function eliminarTodo() {
            if(confirm("⚠️ ADVERTENCIA: Se borrarán TODOS los datos del sistema. ¿Continuar?")) {
                const snap = await db.collection("entregas").get();
                const batch = db.batch();
                snap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("Base de datos limpiada.");
            }
        }

        function filtrarCarpetas() {
            const bus = document.getElementById('buscador').value.toLowerCase();
            const carpetas = document.querySelectorAll('.folder');
            carpetas.forEach(f => {
                f.style.display = f.getAttribute('data-nota').toLowerCase().includes(bus) ? 'block' : 'none';
            });
        }

        // --- MOTOR DEL JUEGO PRO (Versión estable) ---
        const gCanvas = document.getElementById('game-canvas');
        const gCtx = gCanvas.getContext('2d');
        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('alp_high') || 0;
        let gameFrame = 0;
        let speed = 5;

        let player = { x: 50, y: 0, w: 40, h: 30, dy: 0, jump: -10, grounded: false };
        let obstacles = [];

        function initGame() {
            gCanvas.width = gCanvas.offsetWidth;
            gCanvas.height = gCanvas.offsetHeight;
            player.y = gCanvas.height - 50;
            document.getElementById('game-high').innerText = highScore;
            if(!gameActive) {
                gameActive = true;
                score = 0; speed = 5; obstacles = [];
                animate();
            }
        }

        function animate() {
            if(!gameActive) return;
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            gameFrame++;

            player.dy += 0.6;
            player.y += player.dy;
            if(player.y > gCanvas.height - 50) {
                player.y = gCanvas.height - 50;
                player.dy = 0; player.grounded = true;
            }

            // Dibujar Suelo
            gCtx.strokeStyle = "var(--accent)";
            gCtx.beginPath(); gCtx.moveTo(0, gCanvas.height - 20); gCtx.lineTo(gCanvas.width, gCanvas.height - 20); gCtx.stroke();

            // Obstáculos
            if(gameFrame % 100 === 0) obstacles.push({ x: gCanvas.width, w: 30, h: 30 });
            obstacles.forEach((obs, i) => {
                obs.x -= speed;
                gCtx.fillStyle = "#ffda44";
                gCtx.fillRect(obs.x, gCanvas.height - 50, obs.w, obs.h);

                if(player.x < obs.x + obs.w && player.x + player.w > obs.x && player.y + player.h > gCanvas.height - 50) {
                    gameOver();
                }
            });

            // Dibujar Jugador (Montacargas simple)
            gCtx.fillStyle = "var(--accent)";
            gCtx.fillRect(player.x, player.y, player.w, player.h);
            gCtx.fillStyle = "black";
            gCtx.fillRect(player.x + 30, player.y - 10, 5, 40);

            score++; speed += 0.001;
            document.getElementById('game-score').innerText = Math.floor(score/10);
            requestAnimationFrame(animate);
        }

        function gameOver() {
            gameActive = false;
            if(Math.floor(score/10) > highScore) {
                highScore = Math.floor(score/10);
                localStorage.setItem('alp_high', highScore);
            }
            alert("GAME OVER - SCORE: " + Math.floor(score/10));
            setTimeout(initGame, 500);
        }

        gCanvas.addEventListener('touchstart', e => { 
            e.preventDefault(); 
            if(player.grounded) { player.dy = player.jump; player.grounded = false; } 
        });

    </script>
</body>
</html>
