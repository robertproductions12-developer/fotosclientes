<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLIENTES - DESPACHO ALP</title>
    
    <!-- Librerías -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg: #010409;
            --accent: #00f2ff;
            --blue-neon: #0077ff;
            --glass: rgba(15, 23, 42, 0.85);
            --border: rgba(0, 242, 255, 0.3);
            --danger: #ff4d4d;
            --success: #10b981;
            --gold: #ffda44;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(circle at center, #0f172a 0%, #010409 100%);
            color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden;
        }

        .app-card {
            width: 100%; max-width: 480px; background: var(--glass); backdrop-filter: blur(25px);
            border: 2px solid var(--border); border-radius: 30px; padding: 20px;
            height: 95vh; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }
        .header span { color: var(--accent); }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 15px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; color: rgba(255,255,255,0.4); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .tab-btn.active { background: var(--blue-neon); color: white; }

        .view { display: none; flex-direction: column; overflow-y: auto; flex: 1; }
        .view.active { display: flex; }

        /* Emisor */
        .cam-container { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.8rem; }
        .btn-cap { background: var(--accent); color: #000; }
        .btn-send { background: linear-gradient(90deg, #0077ff, #00d4ff); margin-top: 5px; }
        .gallery { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .thumb { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; background-size: cover; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; margin-bottom: 8px; outline: none; }

        /* JUEGO */
        #game-container { background: #000; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid var(--accent); flex: 1; display: flex; flex-direction: column; }
        #game-canvas { width: 100%; flex: 1; touch-action: none; }
        .game-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; pointer-events: none; font-size: 0.8rem; }
        #power-bar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 4px 15px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; display: none; }

        /* Carpeta */
        .folder { background: rgba(255,255,255,0.03); border-radius: 20px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        .folder-title { color: var(--accent); font-weight: bold; }

        #modal-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        #modal-viewer img { max-width: 90%; max-height: 80%; border: 2px solid var(--accent); }
        
        .footer-tag { text-align: center; font-size: 0.6rem; color: rgba(255,255,255,0.2); padding: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="modal-viewer" onclick="this.style.display='none'"><img id="img-full" src=""></div>

    <div class="app-card">
        <div class="header">
            <h1>DESPACHO <span>ALP</span></h1>
            <button onclick="location.reload()" style="background:none; border:none; color:var(--accent); cursor:pointer;">RECARGAR</button>
        </div>

        <div class="tabs">
            <button id="t-emisor" class="tab-btn active" onclick="switchTab('emisor')">DESPACHO</button>
            <button id="t-receptor" class="tab-btn" onclick="switchTab('receptor')">NOTAS</button>
            <button id="t-juego" class="tab-btn" onclick="switchTab('juego')">🕹️ JUEGO PRO</button>
        </div>

        <!-- EMISOR -->
        <div id="v-emisor" class="view active">
            <div class="cam-container"><video id="video" autoplay playsinline></video></div>
            <canvas id="canvas" class="hidden"></canvas>
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px; margin-bottom:12px;">
                <button class="btn btn-cap" onclick="capturePhoto()">📷 FOTO (<span id="count">0</span>/5)</button>
                <button class="btn" style="background:#1e293b" onclick="deleteLastPhoto()">↩</button>
            </div>
            <div class="gallery"><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div>
            <input type="text" id="nombre" placeholder="Nombre del Cliente">
            <input type="text" id="nota" placeholder="N° Nota de Entrega">
            <button class="btn btn-send" id="btn-envio" onclick="enviarAFirebase()">ENVIAR CARPETA</button>
        </div>

        <!-- RECEPTOR -->
        <div id="v-receptor" class="view">
            <input type="text" id="buscador" placeholder="🔍 Buscar Nota..." oninput="filtrarCarpetas()">
            <div id="listado-realtime"></div>
        </div>

        <!-- JUEGO -->
        <div id="v-juego" class="view">
            <div id="game-container">
                <div class="game-ui">
                    <div style="color:var(--accent)">SCORE: <span id="game-score">0</span></div>
                    <div style="color:var(--gold)">🏆 BEST: <span id="game-high">0</span></div>
                </div>
                <div id="power-bar"></div>
                <canvas id="game-canvas"></canvas>
            </div>
            <p style="text-align:center; font-size:0.6rem; margin-top:8px; color:var(--accent)">TOCA PARA SALTAR - AZUL: ROMPE | ROJO: PEQUEÑO</p>
        </div>

        <div class="footer-tag">ROBERT/ELY/HIMMER/PEDRO/HERNÁN 2026</div>
    </div>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = { apiKey: "AIzaSyDia46IAJrJDEuLGA9ULKTlebcjiZ1dYig", authDomain: "fotosclientes-c172e.firebaseapp.com", projectId: "fotosclientes-c172e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // CÁMARA
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let misFotos = [];
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s).catch(e => console.log("Cam off"));

        function capturePhoto() {
            if(misFotos.length >= 5) return;
            canvas.width = 800; canvas.height = 600;
            canvas.getContext('2d').drawImage(video, 0, 0, 800, 600);
            misFotos.push(canvas.toDataURL('image/jpeg', 0.7));
            actualizarInterfaz();
        }
        function deleteLastPhoto() { misFotos.pop(); actualizarInterfaz(); }
        function actualizarInterfaz() {
            document.getElementById('count').innerText = misFotos.length;
            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach((t, i) => { t.style.backgroundImage = misFotos[i] ? `url(${misFotos[i]})` : 'none'; });
        }
        async function enviarAFirebase() {
            const nom = document.getElementById('nombre').value; const not = document.getElementById('nota').value;
            if(!nom || !not || misFotos.length === 0) return alert("Faltan datos");
            try {
                await db.collection("entregas").add({ responsable: nom, nota: not, imagenes: misFotos, fecha: new Date().toLocaleDateString(), hora: new Date().toLocaleTimeString(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                alert("SUBIDO"); location.reload();
            } catch(e) { alert("Error"); }
        }

        // TABS
        function switchTab(t) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`v-${t}`).classList.add('active');
            document.getElementById(`t-${t}`).classList.add('active');
            if(t === 'receptor') iniciarEscucha();
            if(t === 'juego') initGame(); else gameActive = false;
        }

        function iniciarEscucha() {
            db.collection("entregas").orderBy("timestamp", "desc").onSnapshot(snap => {
                const cont = document.getElementById('listado-realtime'); cont.innerHTML = "";
                snap.forEach(doc => { const d = doc.data(); cont.innerHTML += `<div class="folder"> <div class="folder-title">NOTA: ${d.nota}</div> <div style="font-size:0.7rem">${d.responsable} - ${d.fecha}</div> </div>`; });
            });
        }

        // --- MOTOR DEL JUEGO PRO ---
        const gCanvas = document.getElementById('game-canvas');
        const gCtx = gCanvas.getContext('2d');
        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('alp_high') || 0;
        let gameFrame = 0;
        let speed = 5;

        let player = { 
            x: 50, y: 0, baseW: 46, baseH: 35, w: 46, h: 35, 
            dy: 0, jump: -11, grounded: false, 
            powerType: null, powerTime: 0 
        };

        let obstacles = [];
        let powerups = [];

        function initGame() {
            gCanvas.width = gCanvas.offsetWidth;
            gCanvas.height = gCanvas.offsetHeight;
            player.y = gCanvas.height - 50;
            document.getElementById('game-high').innerText = highScore;
            if(!gameActive) {
                gameActive = true;
                score = 0; speed = 5; obstacles = []; powerups = [];
                player.powerType = null;
                animate();
            }
        }

        function drawForklift(x, y, w, h, type) {
            gCtx.save();
            let color = "#ffda44"; // Amarillo normal
            if(type === 'blue') { color = "#00f2ff"; gCtx.shadowBlur = 15; gCtx.shadowColor = color; }
            if(type === 'red') { color = "#ff4d4d"; }

            // Cuerpo
            gCtx.fillStyle = color;
            gCtx.fillRect(x, y, w - 8, h - 10);
            // Mástil
            gCtx.fillStyle = "#333";
            gCtx.fillRect(x + (w - 10), y - 10, 5, h);
            // Cabina
            gCtx.strokeStyle = color;
            gCtx.lineWidth = 2;
            gCtx.strokeRect(x + 5, y - 10, w - 20, 10);
            // Ruedas
            gCtx.fillStyle = "#000";
            gCtx.beginPath();
            gCtx.arc(x + 8, y + (h - 10), 6, 0, Math.PI*2);
            gCtx.arc(x + (w - 15), y + (h - 10), 6, 0, Math.PI*2);
            gCtx.fill();
            gCtx.restore();
        }

        function animate() {
            if(!gameActive) return;
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            gameFrame++;

            // Gravedad
            player.dy += 0.6;
            player.y += player.dy;
            if(player.y > gCanvas.height - player.h - 20) {
                player.y = gCanvas.height - player.h - 20;
                player.dy = 0; player.grounded = true;
            }

            // Manejo de Poderes
            const pBar = document.getElementById('power-bar');
            if(player.powerTime > 0) {
                player.powerTime--;
                pBar.style.display = 'block';
                pBar.innerText = (player.powerType === 'blue' ? 'MODO DEMOLICIÓN: ' : 'MODO MINI: ') + Math.ceil(player.powerTime/60) + 's';
                pBar.style.background = player.powerType === 'blue' ? 'var(--blue-neon)' : 'var(--danger)';
                
                if(player.powerType === 'red') {
                    player.w = player.baseW * 0.6; player.h = player.baseH * 0.6;
                }
            } else {
                player.powerType = null; pBar.style.display = 'none';
                player.w = player.baseW; player.h = player.baseH;
            }

            // Suelo
            gCtx.strokeStyle = "rgba(0,242,255,0.3)";
            gCtx.beginPath(); gCtx.moveTo(0, gCanvas.height - 20); gCtx.lineTo(gCanvas.width, gCanvas.height - 20); gCtx.stroke();

            // Obstáculos
            if(gameFrame % 90 === 0) obstacles.push({ x: gCanvas.width, w: 30, h: 30 });
            obstacles.forEach((obs, i) => {
                obs.x -= speed;
                gCtx.fillStyle = "#8B4513";
                gCtx.fillRect(obs.x, gCanvas.height - 50, obs.w, obs.h);
                gCtx.strokeRect(obs.x + 5, gCanvas.height - 45, obs.w - 10, obs.h - 10);

                // Colisión
                if(player.x < obs.x + obs.w && player.x + player.w > obs.x && player.y + player.h > gCanvas.height - 50) {
                    if(player.powerType === 'blue') {
                        obstacles.splice(i, 1); score += 100;
                    } else {
                        gameOver();
                    }
                }
            });

            // Powerups
            if(gameFrame % 400 === 0) {
                powerups.push({ x: gCanvas.width, y: gCanvas.height - 100, type: Math.random() > 0.5 ? 'blue' : 'red' });
            }
            powerups.forEach((p, i) => {
                p.x -= speed;
                gCtx.fillStyle = p.type === 'blue' ? '#00f2ff' : '#ff4d4d';
                gCtx.beginPath(); gCtx.arc(p.x, p.y, 10, 0, Math.PI*2); gCtx.fill();
                
                if(player.x < p.x + 10 && player.x + player.w > p.x - 10 && player.y < p.y + 10 && player.y + player.h > p.y - 10) {
                    player.powerType = p.type;
                    player.powerTime = 600; // 10 segundos (60fps * 10)
                    powerups.splice(i, 1);
                }
            });

            obstacles = obstacles.filter(o => o.x > -50);
            powerups = powerups.filter(p => p.x > -50);
            
            score++; speed += 0.001;
            document.getElementById('game-score').innerText = Math.floor(score/10);
            drawForklift(player.x, player.y, player.w, player.h, player.powerType);
            requestAnimationFrame(animate);
        }

        function gameOver() {
            gameActive = false;
            let finalScore = Math.floor(score/10);
            if(finalScore > highScore) { highScore = finalScore; localStorage.setItem('alp_high', highScore); }
            
            gCtx.fillStyle = "rgba(255,0,0,0.4)";
            gCtx.fillRect(0,0,gCanvas.width, gCanvas.height);
            gCtx.fillStyle = "white"; gCtx.textAlign = "center"; gCtx.font = "bold 20px Arial";
            gCtx.fillText("¡CHOQUE! REINICIANDO...", gCanvas.width/2, gCanvas.height/2);
            
            setTimeout(initGame, 1500);
        }

        // Controles
        gCanvas.addEventListener('touchstart', e => { e.preventDefault(); if(player.grounded) { player.dy = player.jump; player.grounded = false; } });
        window.addEventListener('keydown', e => { if(e.code === 'Space' && player.grounded) { player.dy = player.jump; player.grounded = false; } });

    </script>
</body>
</html>
